appId: com.imperium.terminal
productName: Imperium
asar: true
compression: normal
npmRebuild: false
forceCodeSigning: false
publish: null
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

directories:
  output: dist
  buildResources: build

files:
  - server.mjs
  - lib/**/*
  - public/**/*
  - desktop/**/*
  - build/icon.png
  - package.json
  - '!**/*.map'
  - '!**/.env*'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

portable:
  requestExecutionLevel: user

nsis:
  artifactName: 'Imperium-Setup-${version}-${arch}.${ext}'
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IMPERIUM
  uninstallDisplayName: IMPERIUM
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  installerLanguages:
    - en_US
    - ko_KR
    - ja_JP

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  sign: false
