appId: com.imperium.terminal
productName: Imperium
asar: true
compression: normal
npmRebuild: false
forceCodeSigning: false
publish: null
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

directories:
  output: dist
  buildResources: build

files:
  - server.mjs
  - lib/**/*
  - public/**/*
  - desktop/**/*
  - build/icon.png
  - THIRD_PARTY_NOTICES.md
  - package.json
  - '!**/*.map'
  - '!**/.env*'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

portable:
  requestExecutionLevel: user

nsis:
  artifactName: 'Imperium-Setup-${version}-${arch}.${ext}'
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IMPERIUM
  uninstallDisplayName: IMPERIUM
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  installerLanguages:
    - en_US
    - ko_KR
    - ja_JP

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  sign: false

linux:
  icon: build/icon.png
  executableName: imperium-terminal
  category: Development
  synopsis: AI organization command terminal
  maintainer: 'Sato Junichiro <75270320+Furu002@users.noreply.github.com>'
  vendor: Sato Junichiro
  desktop:
    entry:
      Name: IMPERIUM
      Comment: AI organization command terminal
      StartupWMClass: Imperium
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
