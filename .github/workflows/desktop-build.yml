name: Build Imperium desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer and portable
            os: windows-latest
            command: build:win
            artifact: imperium-windows-x64
            files: dist/*.exe
          - name: macOS Intel and Apple Silicon
            os: macos-latest
            command: build:mac
            artifact: imperium-macos-intel-apple-silicon
            files: |
              dist/*.dmg
              dist/*.zip
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Test without model calls
        run: npm test
      - name: Build unsigned desktop artifacts
        run: npm run ${{ matrix.command }}
      - name: Upload desktop files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
