name: Build Imperium desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the package version after all desktop builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer and portable
            os: windows-latest
            command: build:win
            artifact: imperium-windows-x64
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest*.yml
          - name: macOS Intel and Apple Silicon
            os: macos-latest
            command: build:mac
            artifact: imperium-macos-intel-apple-silicon
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest*.yml
          - name: Linux x64 Debian and AppImage
            os: ubuntu-latest
            command: build:linux
            artifact: imperium-linux-x64
            files: |
              dist/*.deb
              dist/*.AppImage
              dist/latest*.yml
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw Error('Tag must match package version')"
      - name: Test without model calls
        run: npm test
      - name: Build unsigned desktop artifacts
        run: npm run ${{ matrix.command }}
      - name: Smoke test the packaged terminal backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 dist/linux-unpacked/imperium-terminal scripts/smoke-terminal.mjs dist/linux-unpacked/resources/app.asar
      - name: Inspect Linux desktop package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb > dist/linux-package-contents.txt
          grep -E 'applications/.+\.desktop|chrome-sandbox|imperium-terminal' dist/linux-package-contents.txt
      - name: Upload desktop files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified desktop update
    needs: desktop
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))) && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: imperium-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(node -p "'v'+require('./package.json').version")"
          cd release-assets
          test -f latest.yml
          test -f latest-mac.yml
          test -f latest-linux.yml
          sha256sum -- *.exe *.dmg *.zip *.deb *.AppImage > SHA256SUMS.txt
          printf '%s\n' 'IMPERIUM desktop update. Windows, macOS and Linux installers are built from this tag after automated checks pass. These prototype builds are unsigned. Publisher metadata: Sato Junichiro.' > release-notes.txt
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "IMPERIUM $RELEASE_TAG" --notes-file release-notes.txt --draft
          gh release upload "$RELEASE_TAG" -- *.exe *.dmg *.zip *.deb *.AppImage *.blockmap latest*.yml SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
