name: Build Imperium desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer and portable
            os: windows-latest
            command: build:win
            artifact: imperium-windows-x64
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest*.yml
          - name: macOS Intel and Apple Silicon
            os: macos-latest
            command: build:mac
            artifact: imperium-macos-intel-apple-silicon
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest*.yml
          - name: Linux x64 Debian and AppImage
            os: ubuntu-latest
            command: build:linux
            artifact: imperium-linux-x64
            files: |
              dist/*.deb
              dist/*.AppImage
              dist/latest*.yml
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Test without model calls
        run: npm test
      - name: Build unsigned desktop artifacts
        run: npm run ${{ matrix.command }}
      - name: Smoke test the packaged terminal backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 dist/linux-unpacked/imperium-terminal scripts/smoke-terminal.mjs dist/linux-unpacked/resources/app.asar
      - name: Inspect Linux desktop package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb > dist/linux-package-contents.txt
          grep -E 'applications/.+\.desktop|chrome-sandbox|imperium-terminal' dist/linux-package-contents.txt
      - name: Upload desktop files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
